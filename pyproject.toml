[project]
name = "arc-solver-gohook"
version = "0.1.0"
description = "Evidence-gated hidden-rule learning for GoHook BanAware"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
openai = ["openai>=1.104"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
